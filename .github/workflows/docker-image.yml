name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

     - name: Login to DockerHub
  uses: docker/login-action@v3
  with:
    username: ${{ secrets.DOCKERHUB_USERNAME }}
    password: ${{ secrets.DOCKERHUB_TOKEN }}

- name: Build Backend Image
  run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest ./backend

- name: Push Backend Image
  run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

- name: Build Frontend Image
  run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest ./frontend/employement

- name: Push Frontend Image
  run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

